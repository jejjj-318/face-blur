services:
  face-blur:
    build:
      context: .
      target: runtime
    image: face-blur-homework:1.0
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - videos:/data
    init: true
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
volumes:
  videos:
